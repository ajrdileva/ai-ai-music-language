[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iamp-transmission-engine"
version = "0.1.0"
description = "A reproducible renderer for AI-to-AI musical transmissions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<12"]

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]

[project.scripts]
iamp = "iamp_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iamp_engine = ["py.typed"]
